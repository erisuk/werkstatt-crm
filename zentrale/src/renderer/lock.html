<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zentrale – gesperrt</title>
  <style>
    :root { --bg: #f5f5f7; --card: #ffffff; --text: #1c1c1e; --text-2: #6c6c72; --accent: #0064d2; --warn: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2c2c2e; --text: #f2f2f5; --text-2: #a1a1aa; --accent: #3987e5; --warn: #f87171; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    body { display: grid; place-items: center; -webkit-app-region: drag; }
    main { background: var(--card); border-radius: 20px; padding: 40px 44px; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.12); -webkit-app-region: no-drag; }
    .lock { font-size: 44px; line-height: 1; }
    h1 { font-size: 24px; margin: 14px 0 6px; }
    p { color: var(--text-2); margin: 0 0 22px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 22px; background: var(--accent); color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button.ghost { background: transparent; color: var(--accent); padding: 8px 12px; margin-top: 10px; font-weight: 500; }
    #msg { color: var(--warn); min-height: 1.5em; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="lock" aria-hidden="true">🔒</div>
    <h1>Zentrale gesperrt</h1>
    <p>Nichts aus der Zentrale ist sichtbar, solange sie gesperrt ist. Claude und deine Aufgaben laufen im Hintergrund weiter.</p>
    <button id="touch" autofocus>Mit Touch ID entsperren</button>
    <div><button id="pw" class="ghost">Mit Mac-Passwort entsperren</button></div>
    <p id="msg" role="alert"></p>
  </main>
  <script src="lock.js"></script>
</body>
</html>
