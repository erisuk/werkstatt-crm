<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Zentrale</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span></div>
<div class="window">
  <header class="titlebar">
    <div class="titlebar-name">Zentrale</div>
    <div class="spacer"></div>
    <div id="claude-status" class="status-pill" role="status"></div>
    <label class="search">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr-only">Suchen</span>
      <input id="search" type="search" placeholder="Projekte und Gespräche suchen …" autocomplete="off">
    </label>
  </header>

  <div class="body">
    <nav class="sidebar" aria-label="Hauptmenü">
      <button class="nav-item" data-view="overview">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        Übersicht
      </button>
      <button class="nav-item" data-view="chat">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </button>
      <button class="nav-item" data-view="brain">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 3 3 0 0 0 3-3V7a3 3 0 0 0-3-3z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3 3 3 0 0 1-3-3"/></svg>
        Gehirn
      </button>
      <button class="nav-item" data-view="web">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        Web
      </button>
      <button class="nav-item" data-view="websites">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/><path d="M8 13l-2 2 2 2M16 13l2 2-2 2M13 12l-2 6"/></svg>
        Websites
      </button>
      <button class="nav-item" data-view="planner">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M10 14l4 2.5-4 2.5z"/></svg>
        Planer
      </button>
      <button class="nav-item" data-view="kommentare">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h7M12 8.5v7"/></svg>
        Kommentare
      </button>
      <button class="nav-item" data-view="automations">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 12h4l5-5.5M11.5 12l5 5.5"/></svg>
        Automatisierungen
      </button>
      <button class="nav-item" data-view="local">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H4zM9 20h6M12 16v4"/><path d="M8 9l2 2-2 2M12 13h4"/></svg>
        Localhost
      </button>
      <button class="nav-item" data-view="projects">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>
        Projekte &amp; Server
      </button>
      <button class="nav-item" data-view="mac">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        Mein Mac
      </button>
      <button class="nav-item" data-view="library">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2 8 12.7 4 8.8 9.5 8z"/></svg>
        Skills &amp; Agenten
      </button>
      <button class="nav-item" data-view="tasks">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Tägliche Aufgaben
      </button>
      <button class="nav-item" data-view="finance">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v2"/></svg>
        Privat
      </button>
      <button class="nav-item" data-view="connections">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 7H6a5 5 0 0 0 0 10h3"/><path d="M15 7h3a5 5 0 0 1 0 10h-3"/><path d="M8 12h8"/></svg>
        Verbindungen
      </button>
      <div class="spacer"></div>
      <div class="theme-switch" role="group" aria-label="Darstellung">
        <button data-theme="system">Auto</button>
        <button data-theme="light">Hell</button>
        <button data-theme="dark">Dunkel</button>
      </div>
    </nav>

    <main id="main" class="main"></main>

    <aside class="aside" aria-label="Agenten und Aufgaben">
      <div id="web-activity-hint"></div>
      <section id="approvals-section" hidden>
        <div class="section-head"><h2>Wartet auf dich</h2></div>
        <div id="approvals"></div>
      </section>
      <section>
        <div class="section-head"><h2>Agenten</h2></div>
        <div id="agents"></div>
      </section>
      <section>
        <div class="section-head"><h2>Tägliche Aufgaben</h2><button class="link" id="aside-new-task">+ Neu</button></div>
        <div id="aside-tasks"></div>
      </section>
      <section id="music-section" hidden>
        <div class="section-head"><h2>Musik</h2></div>
        <div id="music"></div>
      </section>
      <div class="spacer"></div>
      <section>
        <h2>Schnell fragen</h2>
        <form id="quick-form" class="composer small">
          <label for="quick-input" class="sr-only">Nachricht an Claude</label>
          <input id="quick-input" type="text" placeholder="Frag Claude …" autocomplete="off">
          <button type="submit" class="send" aria-label="Senden">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
      </section>
    </aside>
  </div>
</div>
<script src="connections-view.js"></script>
<script src="tasks-view.js"></script>
<script src="library-view.js"></script>
<script src="library-workshop.js"></script>
<script src="mac-view.js"></script>
<script src="web-view.js"></script>
<script src="music-view.js"></script>
<script src="automations-view.js"></script>
<script src="brain-view.js"></script>
<script src="projects-view.js"></script>
<script src="planner-view.js"></script>
<script src="websites-view.js"></script>
<script src="finance-view.js"></script>
<script src="kommentare-view.js"></script>
<script src="app.js"></script>
</body>
</html>
