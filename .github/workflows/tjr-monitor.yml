# Prüft alle 30 Minuten TJRs YouTube-Kanal auf neue Videos, fasst sie zusammen und schickt sie per Telegram.
# Benötigte Repository-Secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: TJR Video-Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tjr-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt
      - run: pip install -r requirements.txt
      - name: Neue Videos verarbeiten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tjrbot.monitor
      - name: Status und Wissensbasis speichern
        run: |
          git config user.name "tjr-bot"
          git config user.email "tjr-bot@users.noreply.github.com"
          git add state knowledge
          git diff --cached --quiet || (git commit -m "TJR-Monitor: neue Videos" && git push)
