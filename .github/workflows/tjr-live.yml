# TJR-Modell Live-Signale (Paper-Trading): alle 5 Min. während 09:00–12:00 NY (Sommer- und Winterzeit abgedeckt).
# Morgen-Briefing ab 09:20, Signale sobald die Engine eins findet. Es werden KEINE Orders platziert.
# Benötigte Repository-Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: TJR Live-Signale

on:
  schedule:
    - cron: "*/5 13-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tjr-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt
      - run: pip install -r requirements.txt
      - name: Signale prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tjrbot.live
      - name: Status speichern
        run: |
          git config user.name "tjr-bot"
          git config user.email "tjr-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "TJR-Live: Status" && git pull --rebase && git push)
